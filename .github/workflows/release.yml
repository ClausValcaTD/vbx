name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Binaries
        run: |
          mkdir -p dist
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/vbx-windows-amd64.exe ./cmd/vbx
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/vbx-linux-amd64 ./cmd/vbx
          # macOS Intel & Apple Silicon
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/vbx-macos-amd64 ./cmd/vbx
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/vbx-macos-arm64 ./cmd/vbx

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
